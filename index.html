<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roy's Theremin — Acoustic Field Synthesizer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#090a0d" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app">
      <!-- 3D Three.js WebGL Canvas -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Minimal Floating Camera Viewport (Draggable / Collapsible) -->
      <div id="camera-dock" class="camera-dock" title="Camera Tracking Feed">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="skeleton-canvas" width="220" height="124"></canvas>
        <div class="camera-status">
          <span class="pulse-dot"></span>
          <span id="camera-label" class="camera-label">Tracking Idle</span>
        </div>
      </div>

      <!-- Neumorphic Luxury HUD Overlay -->
      <div id="hud-overlay"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
