<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c26" />
      <stop offset="60%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <!-- Glowing Filament Radial -->
    <radialGradient id="filamentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Rod Gradient -->
    <linearGradient id="chromeRod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Golden Loop Gradient -->
    <linearGradient id="goldLoop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Filament Core Glow -->
  <circle cx="310" cy="230" r="140" fill="url(#filamentGlow)" />
  <circle cx="190" cy="290" r="100" fill="url(#filamentGlow)" opacity="0.6" />

  <!-- Resonant Electromagnetic Field Waves (Concentric Radiating Arcs) -->
  <g filter="url(#softGlow)" fill="none" stroke-linecap="round">
    <!-- Wave Arc 1 -->
    <path d="M 310,130 A 100,100 0 0 1 410,230" stroke="#f59e0b" stroke-width="6" opacity="0.8" />
    <path d="M 210,230 A 100,100 0 0 1 310,130" stroke="#f59e0b" stroke-width="4" opacity="0.4" />

    <!-- Wave Arc 2 -->
    <path d="M 310,80 A 150,150 0 0 1 460,230" stroke="#fbbf24" stroke-width="7" opacity="0.65" />
    <path d="M 160,230 A 150,150 0 0 1 310,80" stroke="#fbbf24" stroke-width="4.5" opacity="0.3" />

    <!-- Wave Arc 3 (Outer subtle harmonic) -->
    <path d="M 310,30 A 200,200 0 0 1 510,230" stroke="#fde68a" stroke-width="5" opacity="0.35" />
  </g>

  <!-- Left Volume Antenna (Horizontal Teardrop Loop) -->
  <g fill="none" stroke="url(#goldLoop)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loop mounting arms & curve -->
    <path d="M 240,320 C 190,320 120,330 90,290 C 65,256 75,210 115,190 C 160,168 215,200 240,240" />
    <circle cx="95" cy="245" r="7" fill="#fbbf24" stroke="none" />
  </g>

  <!-- Theremin Wooden Cabinet Silhouette at Bottom -->
  <rect x="150" y="340" width="220" height="48" rx="8" fill="#1c1917" stroke="#292524" stroke-width="3" />
  <rect x="175" y="352" width="170" height="24" rx="4" fill="#0c0a09" />
  <!-- Rotary knobs -->
  <circle cx="210" cy="364" r="5" fill="#44403c" stroke="#78716c" stroke-width="1.5" />
  <circle cx="260" cy="364" r="5" fill="#44403c" stroke="#78716c" stroke-width="1.5" />
  <circle cx="310" cy="364" r="5" fill="#44403c" stroke="#78716c" stroke-width="1.5" />
  <!-- Ruby pilot indicator -->
  <circle cx="185" cy="364" r="3.5" fill="#ef4444" filter="url(#softGlow)" />

  <!-- Right Pitch Antenna (Vertical Chrome Rod & Sphere Cap) -->
  <g>
    <!-- Base Collar -->
    <rect x="303" y="324" width="14" height="18" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
    <!-- Tapered Rod -->
    <line x1="310" y1="324" x2="310" y2="95" stroke="url(#chromeRod)" stroke-width="10" stroke-linecap="round" />
    <!-- Spherical Cap -->
    <circle cx="310" cy="90" r="13" fill="url(#chromeRod)" stroke="#ffffff" stroke-width="2" />
    <!-- Tip Spark/Shine -->
    <circle cx="307" cy="86" r="3.5" fill="#ffffff" />
    <circle cx="310" cy="90" r="22" fill="#38bdf8" opacity="0.25" filter="url(#softGlow)" />
  </g>

  <!-- Clara Rockmore Expressive Hand Silhouette (Stylized Minimal Vector) -->
  <path d="M 370,165 C 385,150 405,155 410,175 C 413,188 402,202 390,210" fill="none" stroke="#f1f5f9" stroke-width="4.5" stroke-linecap="round" opacity="0.4" />
</svg>